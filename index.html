<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HDB Housing Monetisation Guide</title>
    <meta name="description" content="Interactive retirement planning and housing monetisation guide for Singapore seniors" />
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #f0f4f4; font-family: 'Segoe UI', Arial, sans-serif; }
      input[type=number], input[type=text] {
        width: 100%; padding: 10px 13px; font-size: 15px;
        border: 1.5px solid #b2d8d8; border-radius: 10px;
        outline: none; background: #fff; font-family: inherit;
      }
      input:focus { border-color: #006B6B; }
      select {
        width: 100%; padding: 10px 13px; font-size: 14px;
        border: 1.5px solid #b2d8d8; border-radius: 10px;
        outline: none; background: #fff; font-family: inherit; cursor: pointer;
      }
      select:focus { border-color: #006B6B; }
      button { font-family: inherit; }
      @keyframes coinFall {
        0%   { transform: translateY(-32px) scale(1.1); opacity: 0; }
        15%  { opacity: 1; }
        75%  { opacity: 1; }
        100% { transform: translateY(12px) scale(0.7); opacity: 0; }
      }
      .coin1 { animation: coinFall 2s ease-in 0s infinite; display:inline-block; position:absolute; font-size:15px; }
      .coin2 { animation: coinFall 2s ease-in 0.65s infinite; display:inline-block; position:absolute; font-size:13px; }
      .coin3 { animation: coinFall 2s ease-in 1.3s infinite; display:inline-block; position:absolute; font-size:15px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useState } = React;

      const TEAL="#006B6B", TEAL_LIGHT="#e6f4f4", TEAL_MID="#b2d8d8", GOLD="#c8922a", RED="#b33030";

      // ── CPF retirement sums (2025 cohort) ────────────────────────────────
      const BRS_2025 = 106500, FRS_2025 = 213000, ERS_2025 = 319500;

      // ── Scheme definitions ────────────────────────────────────────────────
      const schemes = {
        SHB: {
          name:"Silver Housing Bonus (SHB)", color:"#1a6e3c", bg:"#e8f5ee", border:"#1a6e3c",
          summary:"Sell flat → buy 3-room or smaller → cash bonus up to $40,000.",
          incomeNote:"Provides a lump sum + higher monthly CPF LIFE payouts via RA top-up. CPF LIFE boost typically +$150–400/month depending on RA balance.",
          details:[
            "Bonus: up to $30,000 (3-room) or $40,000 (2-room Flexi / CCA or smaller)",
            "Commit net CPF RA increase up to $60,000 — from CPF housing refunds (no cash top-up needed)",
            "Join CPF LIFE for monthly income for life",
            "Lump sum from remaining sale proceeds after CPF top-up",
            "Private property owners eligible if AV ≤ $31,000 (from Dec 2025)",
          ],
          note:"Best for: Seniors willing to right-size who want a cash bonus + higher CPF LIFE payouts.",
          link:"https://www.hdb.gov.sg/managing-my-home/retirement-planning/monetising-flat-for-retirement/silver-housing-bonus",
        },
        LBS: {
          name:"Lease Buyback Scheme (LBS)", color:"#1a4e8c", bg:"#e8eef8", border:"#1a4e8c",
          summary:"Stay in flat. Sell tail-end of lease to HDB for bonus + CPF LIFE payouts.",
          incomeNote:"Net proceeds go to CPF RA → lifelong CPF LIFE payouts. Typically adds $300–700/month depending on flat type and remaining lease.",
          details:[
            "Bonus: up to $30,000 (3-room or smaller), $15,000 (4-room), $7,500 (5-room+)",
            "Retain lease to age 95 (youngest owner); cannot sell or sublet flat after joining",
            "Net proceeds top up CPF RA → join CPF LIFE for monthly income for life",
            "Cash above CPF requirement: up to $100,000 lump sum",
          ],
          note:"Best for: Seniors who want to stay and convert excess lease into lifelong income.",
          link:"https://www.hdb.gov.sg/managing-my-home/retirement-planning/monetising-flat-for-retirement/lease-buyback-scheme-lbs",
        },
        RENT_FLAT: {
          name:"Rent Out Entire Flat", color:"#7a3e8c", bg:"#f3eaf8", border:"#7a3e8c",
          summary:"Move out, rent whole flat for monthly rental income.",
          incomeNote:"Typical monthly rental: S$2,000–4,000+ depending on flat type, location, and market. No income ceiling restriction.",
          details:[
            "Monthly rental income — no income ceiling restriction",
            "Must vacate and live elsewhere (e.g. with children)",
            "Cannot sublet to more than 6 unrelated persons; HDB approval required",
            "Subject to HDB renting conditions; MOP must be met",
          ],
          note:"Best for: Seniors who can move in with family and want maximum rental income.",
          link:"https://www.hdb.gov.sg/managing-my-home/retirement-planning",
        },
        RENT_ROOM: {
          name:"Rent Out Spare Bedroom(s)", color:"#8c5a1a", bg:"#f8f0e8", border:"#8c5a1a",
          summary:"Stay in flat, rent out spare rooms for monthly income.",
          incomeNote:"Typical monthly rental: S$800–2,000 per room depending on location. No income ceiling. Can combine with other planning.",
          details:[
            "Monthly income while staying in your flat — no income ceiling",
            "Must remain resident; total occupants must not exceed 6",
            "Available for 3-room flats and above (some 2-room Flexi may qualify)",
            "Short-term rentals (Airbnb etc.) are not allowed",
          ],
          note:"Best for: Seniors with spare rooms who want income while staying at home.",
          link:"https://www.hdb.gov.sg/managing-my-home/retirement-planning",
        },
      };

      // ── Government assistance schemes ────────────────────────────────────
      const govtSchemes = [
        { name:"Matched Retirement Savings Scheme (MRSS)", color:"#2a5c8c", bg:"#eaf2fb",
          who:"SC aged 55+, CPF RA below $106,500 (BRS), monthly income ≤$4,000, property value ≤$21,000, own ≤1 property",
          what:"Government matches cash top-ups to your CPF RA dollar-for-dollar, up to $2,000/year (lifetime cap $20,000). Matched funds earn up to 6% interest. Greatly boosts CPF LIFE payouts.",
          link:"https://www.cpf.gov.sg/member/retirement-income/cpf-retirement-schemes/matched-retirement-savings-scheme" },
        { name:"Silver Support Scheme", color:"#1a5c3a", bg:"#eaf5ee",
          who:"SC aged 65+, household per capita income ≤$1,800/month, living in 3-room or smaller HDB flat",
          what:"Quarterly cash supplement of $180–900. Paid automatically if eligible — no need to apply.",
          link:"https://www.msf.gov.sg/Silver-Support-Scheme" },
        { name:"ComCare Long-Term Assistance", color:"#6b3a1a", bg:"#f8f0e8",
          who:"Unable to work due to age, illness or disability; with little or no family support",
          what:"Monthly cash assistance + help with medical, education, and social needs.",
          link:"https://www.msf.gov.sg/ComCare" },
        { name:"Workfare Income Supplement (WIS)", color:"#5a3a7a", bg:"#f3eaf8",
          who:"SC aged 35+ (30+ if person with disabilities), working, gross income ≤$2,500/month",
          what:"Cash and CPF top-ups for lower-income workers. Helps build CPF savings.",
          link:"https://www.cpf.gov.sg/member/growing-your-savings/government-assistance/workfare-income-supplement" },
      ];

      // ── Decision nodes ────────────────────────────────────────────────────
      const nodes = {
        q_spend: {
          type:"input", inputType:"number",
          text:"How much do you personally spend per month? (S$)",
          sub:"Your own expenses: food, transport, utilities, medical, leisure, loan repayments. Do not include spouse or dependents — we'll ask about those next.",
          placeholder:"e.g. 2000", key:"monthlySpend", next:"q_dependents",
        },
        q_dependents: {
          type:"yesno",
          text:"Do you financially support a spouse or other dependents?",
          sub:"e.g. a spouse whose income/CPF LIFE hasn't started yet, elderly parents, or children not yet independent.",
          yes:"q_dependents_amt", no:"q_retirement_calc",
        },
        q_dependents_amt: {
          type:"input", inputType:"number",
          text:"How much do you spend on your spouse / dependents per month? (S$)",
          sub:"This will be added to your total monthly expenses in the retirement assessment.",
          placeholder:"e.g. 800", key:"dependentsAmt", next:"q_retirement_calc",
        },
        q_retirement_calc: {
          type:"retirementCalc",
          nextSurplus:"q_explore_anyway", nextGap:"q_open_monetise",
        },
        q_explore_anyway: {
          type:"yesno",
          text:"Your retirement income comfortably covers your expenses. Would you still like to explore ways to maximise your retirement income?",
          sub:"Many use these schemes to build a larger buffer, free up cash for healthcare, or reduce pressure on family.",
          yes:"q_citizen_age", no:"terminal_comfortable",
        },
        q_open_monetise: {
          type:"yesno",
          text:"Would you be open to using your flat to supplement your retirement income?",
          sub:"Your flat is likely your largest asset. Options range from staying put (LBS, renting rooms) to right-sizing (SHB).",
          yes:"q_citizen_age", no:"q_alt_sources",
        },
        q_alt_sources: {
          type:"yesno",
          text:"Do you have other means to bridge the gap — e.g. upcoming CPF LIFE payouts, savings you haven't counted, or family support?",
          sub:"CPF LIFE payouts begin at payout eligibility age (typically 65). Family support is very common.",
          yes:"terminal_alt_sources", no:"terminal_urgent",
        },

        // Eligibility
        q_citizen_age: {
          type:"yesno",
          text:"Are you a Singapore Citizen (SC), aged 55 or above?",
          sub:"At least one owner must be SC aged 55+ for SHB eligibility (65+ for LBS). PRs are not eligible for SHB or LBS.",
          yes:"q_mop", no:"ineligible_age",
        },
        q_mop: {
          type:"yesno",
          text:"Have you lived in this flat for at least 5 years (Minimum Occupation Period)?",
          sub:"MOP must be met before selling, renting, or applying for any monetisation scheme.",
          yes:"q_cpf_ra", no:"wait_mop",
        },
        q_cpf_ra: {
          type:"input", inputType:"number",
          text:"What is your CPF Retirement Account (RA) balance approximately? (S$)",
          sub:"Optional — helps us assess your CPF LIFE readiness. Find this on my.cpf.gov.sg → My Dashboard.",
          placeholder:"e.g. 80000", key:"cpfRA", next:"q_stay_move",
        },

        // Stay or move
        q_stay_move: {
          type:"choice",
          text:"Are you willing to move to a smaller flat, or do you prefer to stay in your current home?",
          sub:"This is the key fork. Moving opens the Silver Housing Bonus path. Staying opens LBS and rental options.",
          options:[
            { label:"Willing to move (right-size)", sub:"Sell and buy a smaller flat — SHB path", next:"q_flat_size", inputs:{ stayOrMove:"move" } },
            { label:"Prefer to stay put", sub:"Keep living in my current flat — LBS / rental path", next:"q_rent_open", inputs:{ stayOrMove:"stay" } },
            { label:"I'm not sure yet", sub:"Help me compare both paths", next:"q_unsure_guide", inputs:{ stayOrMove:"unsure" } },
          ],
        },
        q_unsure_guide: {
          type:"choice",
          text:"What matters most to you in retirement? This will help us guide you.",
          sub:"Choose the priority closest to your situation.",
          options:[
            { label:"Maximise my cash lump sum", sub:"Moving and right-sizing typically unlocks the most upfront cash", next:"q_flat_size", inputs:{ stayOrMove:"move" } },
            { label:"Keep my monthly income as high as possible", sub:"Renting out your flat or LBS can provide strong monthly income", next:"q_rent_open", inputs:{ stayOrMove:"stay" } },
            { label:"Minimise disruption — stay in my home", sub:"LBS, renting rooms, or keeping the flat are all stay-put options", next:"q_rent_open", inputs:{ stayOrMove:"stay" } },
            { label:"Leave as much as possible for my children", sub:"Any option that avoids selling the lease is preferable", next:"q_rent_open", inputs:{ stayOrMove:"stay" } },
          ],
        },

        // Moving path
        q_flat_size: {
          type:"multiChoice",
          text:"Which flat type(s) are you open to right-sizing into?",
          sub:"Select all that apply. SHB requires buying a 3-room or smaller flat.",
          options:[
            { id:"3room", label:"3-room flat", sub:"~60–65 sqm · 2 bedrooms · BTO or resale available", badge:"BTO / Resale" },
            { id:"2room", label:"2-room Flexi", sub:"~36–45 sqm · 1 bedroom · BTO only, no resale option · Senior lease (35 or 45 yr) available", badge:"BTO only" },
            { id:"cca",   label:"Community Care Apartment (CCA)", sub:"Studio · Senior care services built in · BTO only · Must be aged 65+ to apply", badge:"BTO only · Age 65+" },
          ],
        },
        q_bto_resale: {
          type:"choice",
          text:"Would you consider a BTO flat, or do you need a resale flat?",
          sub:"BTO (new HDB flat) is cheaper but takes 3–5 years. Resale is available immediately but costs more.",
          options:[
            { label:"BTO (new flat from HDB)", sub:"Lower price, 3–5 year wait; Silver Housing Priority Scheme available for seniors", next:"q_region", inputs:{ flatType:"bto" } },
            { label:"Resale only", sub:"Move in within months, choose specific area and floor", next:"q_region", inputs:{ flatType:"resale" } },
            { label:"Open to either", sub:"Flexible on timing", next:"q_region", inputs:{ flatType:"either" } },
          ],
        },
        q_region: {
          type:"choice",
          text:"Do you have a neighbourhood preference for your new flat?",
          options:[
            { label:"Near my children (within 4 km)", sub:"Eligible for Proximity Housing Grant (PHG) up to $30,000 for resale", next:"q_calculator", inputs:{ region:"proximity" } },
            { label:"Same town I live in now", sub:"Familiar community and social network", next:"q_calculator", inputs:{ region:"same_town" } },
            { label:"Flexible — open to any region", sub:"More BTO ballot chances or lower resale price", next:"q_calculator", inputs:{ region:"flexible" } },
          ],
        },
        q_calculator: { type:"calculator", next:"q_shb_property" },

        q_shb_property: {
          type:"yesno",
          text:"Is your current property an HDB flat, or a private property with Annual Value (AV) ≤ $31,000?",
          sub:"From Dec 2025, SHB extended to private property owners with AV ≤ $31,000 (check IRAS myTax Portal).",
          yes:"q_shb_no_private", no:"ineligible_shb",
        },
        q_shb_no_private: {
          type:"yesno",
          text:"Do you not currently own any other private residential property?",
          sub:"You must not hold another private property concurrently when applying for SHB.",
          yes:"q_income_shb", no:"ineligible_shb_property",
        },
        q_income_shb: {
          type:"yesno",
          text:"Is your gross monthly household income $14,000 or less?",
          sub:"SHB income ceiling. Includes all flat owners' income.",
          yes:"result_SHB", no:"ineligible_income",
        },

        // Staying path
        q_rent_open: {
          type:"yesno",
          text:"Are you open to renting out part or all of your flat for rental income?",
          sub:"No income ceiling applies to renting. You can rent rooms while staying, or move out temporarily.",
          yes:"q_rent_type", no:"q_legacy",
        },
        q_rent_type: {
          type:"choice",
          text:"How would you prefer to generate rental income?",
          options:[
            { label:"Stay in flat, rent out spare room(s)", sub:"Keep living at home, earn from 1 or more bedrooms", next:"q_spare_room" },
            { label:"Move out, rent entire flat", sub:"Live with family, maximise rental income from whole flat", next:"q_alt_stay" },
          ],
        },
        q_spare_room: {
          type:"yesno",
          text:"Does your flat have a spare bedroom you can rent out?",
          sub:"1-room flats generally cannot rent rooms. 2-room Flexi may be eligible in some cases. You must remain living in the flat.",
          yes:"result_RENT_ROOM", no:"no_spare_room",
        },
        q_alt_stay: {
          type:"yesno",
          text:"Do you have somewhere to stay if you move out? (e.g. a child's home)",
          sub:"To rent out the whole flat, you must vacate. You cannot buy another HDB flat at the same time.",
          yes:"result_RENT_FLAT", no:"no_options",
        },
        q_legacy: {
          type:"yesno",
          text:"Are you comfortable with your children not inheriting the full flat?",
          sub:"Under LBS, you sell the tail-end of your lease to HDB. What this means for your family:\n• Flat: Eligible family can continue living in it for the remaining lease, or return it to HDB for a straight-line depreciation refund (not market value).\n• CPF LIFE: Your RA becomes a CPF LIFE premium. If you pass away, the unused portion of that premium is refunded to your CPF nominees.\n• While alive, your CPF RA earns 4% p.a. — well above most savings accounts.\nNo right or wrong answer — it depends on your family's priorities.",
          yes:"q_lbs_flat", no:"q_legacy_rethink",
        },
        q_legacy_rethink: {
          type:"yesno",
          text:"Would you consider right-sizing to a smaller flat instead?",
          sub:"By selling your current flat and buying a smaller one, you keep full ownership — and your children can still inherit, live in, or sell the new flat when the time comes. You may also qualify for the Silver Housing Bonus (up to $40,000 cash).",
          yes:"q_flat_size", no:"terminal_legacy",
        },
        q_lbs_flat: {
          type:"yesno",
          text:"Does your flat meet the lease requirements for LBS?",
          sub:"Your flat must: (1) be a standard HDB flat (not short-lease, HUDC, or Executive Condominium); (2) have at least 20 years of remaining lease; and (3) have enough lease remaining to cover the youngest owner until at least age 95 with some tail left to sell. E.g. if the youngest owner is 70, you need at least 26+ years remaining.",
          yes:"q_lbs_age", no:"ineligible_lbs",
        },
        q_lbs_age: {
          type:"yesno",
          text:"Are ALL flat owners aged 65 or above?",
          sub:"Every owner on the flat title must be at least 65 to qualify for LBS.",
          yes:"q_income_lbs", no:"lbs_age_fail",
        },
        q_income_lbs: {
          type:"yesno",
          text:"Is your gross monthly household income $14,000 or less?",
          sub:"LBS income ceiling. Includes all flat owners' income.",
          yes:"result_LBS", no:"ineligible_income",
        },
      };

      // ── Terminals ─────────────────────────────────────────────────────────
      const terminals = {
        terminal_comfortable: {
          type:"success", title:"Your Retirement Finances Look Strong",
          msg:"Your income comfortably covers your expenses. You may still consider these schemes to build a larger CPF LIFE buffer, reduce pressure on family, or free up cash for healthcare.",
          link:{ text:"CPF Retirement Planning", url:"https://www.cpf.gov.sg/member/retirement-income" },
        },
        terminal_alt_sources: {
          type:"info", title:"You Have Alternative Sources",
          msg:"Good — family support and upcoming CPF LIFE payouts are reliable and common. Your flat remains an option if needs change. Consider a retirement income review with CPF Board.",
          link:{ text:"CPF Retirement Planning", url:"https://www.cpf.gov.sg/member/retirement-income" },
        },
        terminal_urgent: {
          type:"error", title:"Consider Seeking Financial Guidance Soon",
          msg:"We strongly encourage speaking with a CPF financial planner or an MSF Social Worker — they can help you assess all available options and assistance. Social assistance schemes — ComCare, Silver Support, GST Vouchers — may also help bridge the gap. If you wish to explore housing monetisation specifically, HDB can also help.",
          links:[
            { text:"CPF Financial Planning — my.cpf.gov.sg", url:"https://www.cpf.gov.sg/member/retirement-income" },
            { text:"MSF Social Service Offices (find nearest)", url:"https://www.msf.gov.sg/our-services/financial-support/comcare/long-term-assistance" },
            { text:"HDB Housing Monetisation — call 6225-5432", url:"https://www.hdb.gov.sg/managing-my-home/retirement-planning/monetising-flat-for-retirement" },
          ],
        },
        terminal_legacy: {
          type:"info", title:"Preserving the Full Flat Lease for Your Family",
          msg:"That's a meaningful priority. LBS reduces the lease your heirs inherit, so it may not suit your wishes. Consider renting out spare rooms for income while keeping the full lease intact.",
          options:["RENT_ROOM"],
          link:{ text:"HDB Rental Options", url:"https://www.hdb.gov.sg/managing-my-home/retirement-planning" },
        },
        ineligible_age: {
          type:"planning", title:"Great Time to Start Planning Ahead",
          msg:"You haven't reached the minimum age yet — but planning now puts you in a much stronger position. Here's what to expect:",
          timeline:[
            { age:55, label:"Eligible for Silver Housing Bonus (SHB)", detail:"Consider right-sizing to a 3-room or smaller flat for a cash bonus of up to $40,000." },
            { age:55, label:"CPF RA created", detail:"Savings above the Basic Retirement Sum can be withdrawn. Start building your RA now." },
            { age:60, label:"Consider a retirement income review", detail:"Check your projected CPF LIFE payouts on my.cpf.gov.sg." },
            { age:65, label:"Eligible for LBS", detail:"Can sell tail-end of lease to HDB for CPF LIFE income without moving." },
            { age:65, label:"CPF LIFE payouts begin", detail:"Monthly payouts for life. Amount depends on your RA balance at 65." },
          ],
          tipNow:"In the meantime: renting out spare rooms has no age restriction. Start building your CPF RA and explore the MRSS scheme — the govt matches your top-ups dollar-for-dollar up to $2,000/year (lifetime cap $20,000), and your RA earns 4–6% interest per year.",
        },
        wait_mop: {
          type:"planning", title:"MOP Not Yet Met — But You're Thinking Ahead",
          msg:"You need to have lived in this flat for at least 5 years (MOP). Check your MOP completion date on the HDB portal. You're in a good position to plan now.",
          tipNow:"Use this time to: check projected CPF LIFE payouts, explore the MRSS scheme, and decide whether you'd prefer to right-size or stay when the time comes.",
        },
        ineligible_shb: {
          type:"warning", title:"Property Not Eligible for SHB",
          msg:"SHB requires an HDB flat or private property with AV ≤ $31,000. If your AV is higher, consider LBS (if staying) or renting instead.",
          options:["LBS", "RENT_ROOM"],
        },
        ineligible_shb_property: {
          type:"warning", title:"Other Private Property Held",
          msg:"You cannot hold another private residential property when applying for SHB. Disposing of it first may unlock SHB eligibility.",
          options:["RENT_ROOM", "RENT_FLAT"],
        },
        ineligible_income: {
          type:"warning", title:"Income Ceiling Exceeded",
          msg:"SHB and LBS both have a $14,000/month gross household income ceiling. Renting out your flat or rooms has no income ceiling and remains fully available.",
          options:["RENT_ROOM", "RENT_FLAT"],
        },
        ineligible_lbs: {
          type:"warning", title:"Flat Not Eligible for LBS",
          msg:"LBS requires a standard HDB flat (not short-lease, HUDC, or EC) with at least 20 years remaining lease. Consider renting out spare rooms instead.",
          options:["RENT_ROOM"],
        },
        lbs_age_fail: {
          type:"planning", title:"Not Yet 65 — But LBS is on the Horizon",
          msg:"All flat owners must be 65+ for LBS. If you or a co-owner is between 55–64, here's a suggested path:",
          timeline:[
            { age:55, label:"Now eligible for SHB", detail:"Consider right-sizing to a smaller flat for the Silver Housing Bonus." },
            { age:65, label:"All owners 65+ — LBS becomes available", detail:"Apply for LBS to sell the tail-end lease while staying in your flat." },
          ],
          tipNow:"In the meantime: rent out spare rooms (no age restriction), or consider SHB if you're open to moving.",
          options:["SHB", "RENT_ROOM"],
        },
        no_spare_room: {
          type:"info", title:"No Spare Bedroom Available",
          msg:"Without a spare bedroom, renting a room isn't viable while staying. Consider LBS (sell tail-end lease, stay in flat) or SHB (right-size to a smaller flat).",
          options:["LBS","SHB"],
        },
        no_options: {
          type:"info", title:"Limited Options Without a Place to Move",
          msg:"Renting your whole flat requires you to vacate. If that isn't feasible, consider renting a spare room (if available) or LBS (if eligible).",
          options:["RENT_ROOM","LBS"],
        },
      };

      const termColors = { error:RED, warning:GOLD, info:TEAL, success:"#1a6e3c", planning:"#1a5c3a" };
      const termBgs    = { error:"#fdeaea", warning:"#fdf5e6", info:TEAL_LIGHT, success:"#e8f5ee", planning:"#e8f5f0" };

      // ── InfoTip: hover tooltip ────────────────────────────────────────────
      function InfoTip({ text }){
        const [show,setShow]=useState(false);
        return(
          <span style={{ position:"relative",display:"inline-block",marginLeft:5,cursor:"help",verticalAlign:"middle" }}
            onMouseEnter={()=>setShow(true)} onMouseLeave={()=>setShow(false)}>
            <span style={{ fontSize:10.5,background:"#ccc",borderRadius:"50%",padding:"1px 5px",color:"#444",fontWeight:700,userSelect:"none",lineHeight:1 }}>i</span>
            {show&&(
              <div style={{ position:"absolute",bottom:"calc(100% + 8px)",left:"50%",transform:"translateX(-50%)",
                background:"#222",color:"#fff",padding:"8px 12px",borderRadius:8,fontSize:12,
                width:250,zIndex:300,lineHeight:1.6,boxShadow:"0 4px 16px rgba(0,0,0,0.3)",pointerEvents:"none",whiteSpace:"normal" }}>
                {text}
                <div style={{ position:"absolute",bottom:-6,left:"50%",transform:"translateX(-50%)",
                  width:0,height:0,borderLeft:"6px solid transparent",borderRight:"6px solid transparent",borderTop:"6px solid #222" }}/>
              </div>

      // ── Retirement income calculator ───────────────────────────────────────

      // ── Bala's table (SLA official milestone values, interpolated per year) ─
      // Source: Singapore Land Authority / Land Betterment Charge Regulations 2022
      const BALA_PTS=[[0,0],[5,0.171],[10,0.300],[15,0.400],[20,0.480],[24,0.534],
        [30,0.600],[35,0.646],[40,0.685],[45,0.718],[49,0.741],
        [55,0.773],[60,0.800],[65,0.830],[70,0.860],[74,0.880],
        [80,0.910],[85,0.929],[90,0.946],[95,0.956],[99,0.960]];
      function balaFraction(n){
        if(n<=0)return 0; if(n>=99)return BALA_PTS[BALA_PTS.length-1][1];
        for(let i=1;i<BALA_PTS.length;i++){
          if(n<=BALA_PTS[i][0]){
            const[x0,y0]=BALA_PTS[i-1],[x1,y1]=BALA_PTS[i];
            return y0+(y1-y0)*(n-x0)/(x1-x0);
          }
        }
        return BALA_PTS[BALA_PTS.length-1][1];
      }

      // FRS by age group (2025 HDB figures used by LBS)
      function getFRS(age){ if(age>=80)return 200400; if(age>=70)return 210400; return 220400; }
      function getBRS(age){ return Math.round(getFRS(age)/2); }
      // Min lease to retain = max(35, 95 - age)  per HDB LBS rules
      function minRetain(age){ return Math.max(35, 95-age); }

      // ── LBS proceeds estimator ────────────────────────────────────────────
      function LBSCalculator(){
        const[open,        setOpen]       =useState(false);
        const[flatValue,   setFlatValue]  =useState("");
        const[remainLease, setRemainLease]=useState("");
        const[numOwners,   setNumOwners]  =useState("1");
        const[age1,        setAge1]       =useState("");
        const[ra1,         setRa1]        =useState("");
        const[age2,        setAge2]       =useState("");
        const[ra2,         setRa2]        =useState("");
        const[outstandingLoan,setOutstandingLoan]=useState("");
        const[flatTypeLBS, setFlatTypeLBS]=useState("3room_smaller");
        const[hdbQuote,    setHdbQuote]   =useState("");

        const n=v=>parseFloat(v)||0;
        const twoOwners=numOwners==="2";
        const fv=n(flatValue), rl=n(remainLease), loan=n(outstandingLoan);
        const a1=n(age1), a2=twoOwners?n(age2):0;
        const r1=n(ra1), r2=twoOwners?n(ra2):0;
        const youngestAge=twoOwners?Math.min(a1||99,a2||99):a1;
        const retainedLease=youngestAge>0?Math.max(minRetain(youngestAge),0):0;

        // Use HDB quote if provided, otherwise Bala estimate
        const bR=balaFraction(rl), bRet=balaFraction(retainedLease);
        const tailFraction=bR>0?(bR-bRet)/bR:0;
        const balaEstimate=Math.round(fv*tailFraction);
        const grossProceeds=n(hdbQuote)||balaEstimate;
        const netProceeds=Math.max(0,grossProceeds-loan);

        // Split per owner (equal 50/50 for simplicity)
        const share1=twoOwners?0.5:1, share2=twoOwners?0.5:0;
        const proc1=Math.round(netProceeds*share1), proc2=Math.round(netProceeds*share2);

        // Per-owner RA top-up logic
        function calcOwner(procShare, currentRA, age, isSole){
          const target=isSole?getFRS(age):getBRS(age);
          const needed=Math.max(0,target-currentRA);
          const topUp=Math.min(needed,procShare);
          const remaining=procShare-topUp;
          return{ target, needed, topUp, remaining, newRA:currentRA+topUp };
        }
        const isSole=!twoOwners;
        const o1=calcOwner(proc1,r1,a1,isSole);
        const o2=twoOwners?calcOwner(proc2,r2,a2,false):{topUp:0,remaining:0,newRA:r2};
        const totalTopUp=o1.topUp+(twoOwners?o2.topUp:0);
        const totalRemaining=o1.remaining+(twoOwners?o2.remaining:0);

        // Cash disbursement: up to $100k household, excess to RA
        const cashPayout=Math.min(totalRemaining,100000);
        const extraToRA=Math.max(0,totalRemaining-100000);

        // Bonus: full if totalTopUp >= $60k, else pro-rated
        const maxBonus=flatTypeLBS==="4room"?15000:flatTypeLBS==="5room_larger"?7500:30000;
        const proRateDivisor=flatTypeLBS==="4room"?4:flatTypeLBS==="5room_larger"?8:2;
        const bonus=totalTopUp>=60000?maxBonus:Math.min(maxBonus,Math.round(totalTopUp/proRateDivisor));

        const canCalc=fv>0&&rl>0&&youngestAge>0;
        const retainTail=Math.max(0,rl-retainedLease);

        const row=(label,val,color,sub)=>(
          <div style={{ padding:"5px 0",borderBottom:"1px solid #ebebeb" }}>
            <div style={{ display:"flex",justifyContent:"space-between",fontSize:13 }}>
              <span style={{ color:"#555" }}>{label}</span>
              <span style={{ fontWeight:600,color:color||"#222" }}>{val}</span>
            </div>
            {sub&&<div style={{ fontSize:11,color:"#999",marginTop:1 }}>{sub}</div>}
          </div>
        );
        const subhead=(t)=>(<div style={{ fontSize:11,fontWeight:700,color:"#888",letterSpacing:0.5,textTransform:"uppercase",marginTop:12,marginBottom:4 }}>{t}</div>);

        return(
          <div style={{ border:"1.5px solid #d0d0d0",borderRadius:10,marginBottom:12,overflow:"hidden" }}>
            <button onClick={()=>setOpen(v=>!v)}
              style={{ width:"100%",background:"#f0f4fb",border:"none",padding:"12px 16px",
                cursor:"pointer",textAlign:"left",display:"flex",justifyContent:"space-between",alignItems:"center" }}>
              <span style={{ fontSize:13.5,fontWeight:700,color:"#1a4e8c" }}>🧮 Estimate Your LBS Proceeds</span>
              <span style={{ fontSize:12,color:"#888" }}>{open?"▲ hide":"▼ show"}</span>
            </button>
            {open&&(
              <div style={{ padding:"14px 16px",background:"#fff" }}>
                <div style={{ fontSize:12.5,color:"#666",marginBottom:14,lineHeight:1.5 }}>
                  Estimates use <strong>Bala's curve</strong> (SLA official table). Confirm exact figures with HDB — call <strong>6225-5432</strong> (weekdays 8am–5pm).
                </div>

                {/* Flat details */}
                <div style={{ fontSize:11,fontWeight:700,color:"#888",letterSpacing:0.5,textTransform:"uppercase",marginBottom:8 }}>Flat Details</div>
                <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:14 }}>
                  <div>
                    <label style={{ display:"block",fontSize:12.5,fontWeight:600,color:"#333",marginBottom:4 }}>Flat market value (S$)</label>
                    <input type="number" value={flatValue} onChange={e=>setFlatValue(e.target.value)} placeholder="e.g. 500000" style={{ padding:"9px 12px",fontSize:14 }} />
                    <div style={{ fontSize:11,color:"#aaa",marginTop:3 }}>Check HDB Resale Portal for recent transactions</div>
                  </div>
                  <div>
                    <label style={{ display:"block",fontSize:12.5,fontWeight:600,color:"#333",marginBottom:4 }}>Remaining lease (years)</label>
                    <input type="number" value={remainLease} onChange={e=>setRemainLease(e.target.value)} placeholder="e.g. 60" style={{ padding:"9px 12px",fontSize:14 }} />
                    <div style={{ fontSize:11,color:"#aaa",marginTop:3 }}>On your HDB title or MyHDBPage</div>
                  </div>
                  <div>
                    <label style={{ display:"block",fontSize:12.5,fontWeight:600,color:"#333",marginBottom:4 }}>HDB quoted sale price (optional)</label>
                    <input type="number" value={hdbQuote} onChange={e=>setHdbQuote(e.target.value)} placeholder="If you have HDB's figure" style={{ padding:"9px 12px",fontSize:14 }} />
                    <div style={{ fontSize:11,color:"#aaa",marginTop:3 }}>Overrides Bala's estimate if entered</div>
                  </div>
                  <div>
                    <label style={{ display:"block",fontSize:12.5,fontWeight:600,color:"#333",marginBottom:4 }}>Outstanding loan / upgrading cost (S$)</label>
                    <input type="number" value={outstandingLoan} onChange={e=>setOutstandingLoan(e.target.value)} placeholder="e.g. 0" style={{ padding:"9px 12px",fontSize:14 }} />
                    <div style={{ fontSize:11,color:"#aaa",marginTop:3 }}>Deducted from proceeds first</div>
                  </div>
                </div>
                <div style={{ marginBottom:14 }}>
                  <label style={{ display:"block",fontSize:12.5,fontWeight:600,color:"#333",marginBottom:4 }}>Flat type</label>
                  <select value={flatTypeLBS} onChange={e=>setFlatTypeLBS(e.target.value)} style={{ maxWidth:340 }}>
                    <option value="3room_smaller">3-room or smaller — max bonus $30,000</option>
                    <option value="4room">4-room — max bonus $15,000</option>
                    <option value="5room_larger">5-room or larger — max bonus $7,500</option>
                  </select>
                </div>

                {/* Owner details */}
                <div style={{ fontSize:11,fontWeight:700,color:"#888",letterSpacing:0.5,textTransform:"uppercase",marginBottom:8 }}>Owner Details</div>
                <div style={{ marginBottom:12 }}>
                  <label style={{ display:"block",fontSize:12.5,fontWeight:600,color:"#333",marginBottom:6 }}>Number of owners on the flat</label>
                  <div style={{ display:"flex",gap:10 }}>
                    {["1","2"].map(v=>(
                      <button key={v} onClick={()=>setNumOwners(v)}
                        style={{ flex:1,padding:"9px 0",borderRadius:8,border:`1.5px solid ${numOwners===v?"#1a4e8c":"#ccc"}`,
                          background:numOwners===v?"#e8eef8":"#fff",fontWeight:600,color:numOwners===v?"#1a4e8c":"#555",cursor:"pointer",fontSize:13 }}>
                        {v} owner{v==="2"?"s":""}
                      </button>
                    ))}
                  </div>
                </div>
                <div style={{ display:"grid",gridTemplateColumns:twoOwners?"1fr 1fr":"1fr 1fr",gap:12,marginBottom:14 }}>
                  <div>
                    <label style={{ display:"block",fontSize:12.5,fontWeight:600,color:"#333",marginBottom:4 }}>Owner 1 — Age</label>
                    <input type="number" value={age1} onChange={e=>setAge1(e.target.value)} placeholder="e.g. 68" style={{ padding:"9px 12px",fontSize:14 }} />
                  </div>
                  <div>
                    <label style={{ display:"block",fontSize:12.5,fontWeight:600,color:"#333",marginBottom:4 }}>Owner 1 — CPF RA balance (S$)</label>
                    <input type="number" value={ra1} onChange={e=>setRa1(e.target.value)} placeholder="e.g. 80000" style={{ padding:"9px 12px",fontSize:14 }} />
                    <div style={{ fontSize:11,color:"#aaa",marginTop:3 }}>Check my.cpf.gov.sg → My Dashboard</div>
                  </div>
                  {twoOwners&&(<>
                    <div>
                      <label style={{ display:"block",fontSize:12.5,fontWeight:600,color:"#333",marginBottom:4 }}>Owner 2 — Age</label>
                      <input type="number" value={age2} onChange={e=>setAge2(e.target.value)} placeholder="e.g. 65" style={{ padding:"9px 12px",fontSize:14 }} />
                    </div>
                    <div>
                      <label style={{ display:"block",fontSize:12.5,fontWeight:600,color:"#333",marginBottom:4 }}>Owner 2 — CPF RA balance (S$)</label>
                      <input type="number" value={ra2} onChange={e=>setRa2(e.target.value)} placeholder="e.g. 60000" style={{ padding:"9px 12px",fontSize:14 }} />
                    </div>
                  </>)}
                </div>

                {canCalc&&(
                  <div style={{ border:"1.5px solid #b0c8e8",borderRadius:10,padding:"12px 16px",background:"#f0f6fc" }}>
                    <div style={{ fontSize:13.5,fontWeight:700,color:"#1a4e8c",marginBottom:10 }}>Estimated LBS Proceeds</div>

                    {subhead("Lease valuation (Bala's curve)")}
                    {row("Flat market value",fmt(fv),"#1a4e8c")}
                    {row(`Lease to retain (${retainedLease} yrs → youngest owner to age 95)`,`Bala: ${(balaFraction(retainedLease)*100).toFixed(1)}%`,"#555",`Min retain: ${minRetain(youngestAge)} yrs for age ${youngestAge}`)}
                    {row(`Lease sold to HDB (tail: ${retainTail} yrs)`,`${(tailFraction*100).toFixed(1)}% of flat value`,"#555")}
                    {n(hdbQuote)>0
                      ? row("Gross proceeds (HDB quoted)",fmt(grossProceeds),"#1a4e8c","Using HDB's actual figure")
                      : row("Estimated gross proceeds (Bala)",fmt(grossProceeds),"#1a4e8c","Indicative — actual HDB valuation may differ")}
                    {loan>0&&row("Less: outstanding loan / upgrading costs",`−${fmt(loan)}`,"#b33030")}
                    {row("Net proceeds to allocate",fmt(netProceeds),"#1a4e8c")}

                    {subhead("CPF RA top-up")}
                    <div style={{ fontSize:12,color:"#555",marginBottom:6,lineHeight:1.5 }}>
                      {isSole
                        ?<>Sole owner tops up to <strong>FRS ({fmt(getFRS(a1))})</strong>. Requires +{fmt(o1.needed)} but only {fmt(proc1)} available.</>
                        :<>Each owner tops up to <strong>BRS</strong> (half FRS). With 2 owners, a property pledge covers the other half.</>}
                    </div>
                    {row(`Owner 1 RA top-up (current: ${fmt(r1)} → target ${fmt(o1.target)})`,`+${fmt(o1.topUp)}`,"#1a6e3c")}
                    {twoOwners&&row(`Owner 2 RA top-up (current: ${fmt(r2)} → target ${fmt(o2.target)})`,`+${fmt(o2.topUp)}`,"#1a6e3c")}
                    {row("Total CPF RA top-up",fmt(totalTopUp),"#1a6e3c")}

                    {subhead("Cash disbursement")}
                    {row("Cash payout (capped at $100k household)",fmt(cashPayout),cashPayout>0?"#1a6e3c":"#888")}
                    {extraToRA>0&&row("Excess above $100k → further RA top-up",fmt(extraToRA),"#555")}

                    {subhead("LBS bonus")}
                    <div style={{ fontSize:12,color:"#555",marginBottom:6,lineHeight:1.5 }}>
                      {totalTopUp>=60000
                        ?<>Total top-up ≥ $60,000 → <strong>full bonus</strong> awarded.</>
                        :<>Total top-up {fmt(totalTopUp)} &lt; $60,000 → pro-rated bonus ({flatTypeLBS==="3room_smaller"?"$1 per $2 topped up":flatTypeLBS==="4room"?"$1 per $4 topped up":"$1 per $8 topped up"}).</>}
                    </div>
                    {row(`LBS bonus (${flatTypeLBS==="4room"?"4-room":flatTypeLBS==="5room_larger"?"5-room+":"3-room or smaller"})`,`+${fmt(bonus)}`,"#1a6e3c")}

                    <div style={{ display:"flex",justifyContent:"space-between",padding:"9px 0 3px",borderTop:"2px solid #9ab8d8",marginTop:6,fontSize:14,fontWeight:800 }}>
                      <span style={{ color:"#1a4e8c" }}>Total CPF RA after LBS</span>
                      <span style={{ color:"#1a6e3c" }}>{fmt(o1.newRA+(twoOwners?o2.newRA:0)+bonus+extraToRA)}</span>
                    </div>
                    <div style={{ display:"flex",justifyContent:"space-between",padding:"5px 0 6px",fontSize:13,fontWeight:700 }}>
                      <span style={{ color:"#555" }}>Cash in hand</span>
                      <span style={{ color:"#1a6e3c" }}>{fmt(cashPayout)}</span>
                    </div>

                    <div style={{ marginTop:10,padding:"10px 12px",background:"#e8eef8",borderRadius:8,border:"1px solid #a8bae0",fontSize:12,color:"#1a2e6e",lineHeight:1.7 }}>
                      <strong>After LBS:</strong> Your RA proceeds become a <strong>CPF LIFE premium</strong>, earning <strong>4% p.a.</strong> interest before conversion, then paying you a monthly income for life. You <em>cannot</em> sublet the flat after joining.<br/>
                      <strong>If you pass away:</strong> (1) Family members can continue living in the flat (subject to HDB eligibility) or return it to HDB for a straight-line depreciation refund. (2) The unused portion of your CPF LIFE premium (premium minus payouts already received) is refunded to your CPF accounts and distributed to your nominees.
                    </div>
                    <div style={{ marginTop:8,fontSize:11.5,color:"#888",lineHeight:1.5 }}>
                      ⚠️ Indicative only — based on Bala's curve interpolation. HDB's actual valuation may differ. Call <strong>6225-5432</strong> or visit any HDB branch for a personalised assessment. Reference: <a href="https://thejaminator.github.io/lease_buyback/" target="_blank" rel="noreferrer" style={{ color:"#1a4e8c" }}>Community LBS Calculator ↗</a>
                    </div>
                  </div>
                )}
                {!canCalc&&(
                  <div style={{ padding:"10px 12px",background:"#f0f0f0",borderRadius:8,fontSize:13,color:"#777" }}>
                    Enter your flat value, remaining lease, and owner age(s) to see the estimate.
                  </div>
                )}
              </div>
            )}
          </div>
        );
      }

      // ── Rightsizing calculator ────────────────────────────────────────────
      const RESALE_LEVY={ "2room":15000,"3room":30000,"4room":40000,"5room":45000,"exec":50000 };

      function Calculator({ userInputs, onContinue }){
        const[salePrice,    setSalePrice]   =useState("");
        const[cpfUsed,      setCpfUsed]     =useState("");
        const[yearsOwned,   setYearsOwned]  =useState("");
        const[newFlatPrice, setNewFlatPrice]=useState("");
        const[isBTO,        setIsBTO]       =useState(userInputs.flatType==="bto");
        const[soldFlatType, setSoldFlatType]=useState("4room");
        const[renovCost,    setRenovCost]   =useState("");

        const n=v=>parseFloat(v)||0;
        const sale=n(salePrice), cpf=n(cpfUsed), years=n(yearsOwned)||10, newFlat=n(newFlatPrice), renov=n(renovCost);

        const cpfInterest=Math.round(cpf*(Math.pow(1.025,years)-1));
        const cpfRefund=cpf+cpfInterest;
        const sellingAgent=Math.round(sale*0.01);
        const sellingLegal=3200;
        const cashFromSale=sale-cpfRefund-sellingAgent-sellingLegal;

        const bsd=Math.round(calcBSD(newFlat));
        const buyingAgent=isBTO?0:Math.round(newFlat*0.01);
        const buyingLegal=3200;
        const levy=isBTO?(RESALE_LEVY[soldFlatType]||0):0;
        const totalBuying=newFlat+bsd+buyingAgent+buyingLegal+levy;
        const cpfForNew=Math.min(cpfRefund,newFlat);
        const cashForNew=Math.max(0,totalBuying-cpfRefund);
        const cpfLeftover=Math.max(0,cpfRefund-newFlat-bsd-buyingAgent-buyingLegal-levy);
        const netBeforeRenov=cashFromSale-cashForNew;
        const netCash=netBeforeRenov-renov;

        const flatSize=userInputs.flatSize||"3room";
        const shbBonus=flatSize==="cca"?40000:flatSize==="3room"?30000:40000;
        const phgGrant=(userInputs.region==="proximity"&&!isBTO)?30000:0;
        const totalWithBonuses=netCash+shbBonus+phgGrant;
        const canCalc=sale>0&&newFlat>0;

        const rowTip=(label,tip,val,color)=>(
          <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",padding:"5px 0",borderBottom:"1px solid #ebebeb",fontSize:13 }}>
            <span style={{ color:"#555",display:"flex",alignItems:"center" }}>{label}{tip&&<InfoTip text={tip}/>}</span>
            <span style={{ fontWeight:600,color:color||"#222" }}>{val}</span>
          </div>
        );
        const subhead=(t)=>(<div style={{ fontSize:11,fontWeight:700,color:"#888",letterSpacing:0.5,textTransform:"uppercase",marginTop:14,marginBottom:5 }}>{t}</div>);

        const inputField=(label,val,setter,placeholder,hint)=>(
          <div>
            <label style={{ display:"block",fontSize:12.5,fontWeight:600,color:"#333",marginBottom:4 }}>{label}</label>
            <input type="number" value={val} onChange={e=>setter(e.target.value)} placeholder={placeholder} style={{ padding:"9px 12px",fontSize:14 }} />
            {hint&&<div style={{ fontSize:11,color:"#aaa",marginTop:3 }}>{hint}</div>}
          </div>
        );

        const flatTypes=userInputs.flatSizes||[];
        const smallestFlat=flatTypes.includes("cca")||flatTypes.includes("2room")?"small":"3room";

        return(
          <div>
            <div style={{ fontSize:17,fontWeight:700,color:"#1a1a1a",marginBottom:4 }}>Rightsizing Proceeds Estimator</div>
            <div style={{ fontSize:13,color:"#666",marginBottom:18,lineHeight:1.5 }}>Rough estimates only — confirm exact figures with HDB and your solicitor.</div>

            <div style={{ display:"grid",gap:14,marginBottom:18 }}>
              <div>{inputField("Estimated sale price of current flat (S$)",salePrice,setSalePrice,"e.g. 650000","Check recent prices on HDB's Resale Flat Prices portal")}</div>
              <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:12 }}>
                {inputField("CPF used for this flat (S$)",cpfUsed,setCpfUsed,"e.g. 200000","Check my.cpf.gov.sg → My Home")}
                {inputField("Years owned",yearsOwned,setYearsOwned,"e.g. 25","Used to calculate CPF accrued interest")}
              </div>
              <div>{inputField("Estimated price of new flat (S$)",newFlatPrice,setNewFlatPrice,"e.g. 320000",
                userInputs.flatType==="bto"?"BTO flats are typically 15–30% below comparable resale prices":null)}</div>
              <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:12 }}>
                <div>
                  <label style={{ display:"block",fontSize:12.5,fontWeight:600,color:"#333",marginBottom:4 }}>Buying a BTO flat?</label>
                  <select value={isBTO?"yes":"no"} onChange={e=>setIsBTO(e.target.value==="yes")}>
                    <option value="no">No (resale flat)</option>
                    <option value="yes">Yes (new BTO from HDB)</option>
                  </select>
                </div>
                {isBTO&&(
                  <div>
                    <label style={{ display:"block",fontSize:12.5,fontWeight:600,color:"#333",marginBottom:4 }}>Type of flat you're selling</label>
                    <select value={soldFlatType} onChange={e=>setSoldFlatType(e.target.value)}>
                      <option value="3room">3-room</option>
                      <option value="4room">4-room</option>
                      <option value="5room">5-room</option>
                      <option value="exec">Executive</option>
                    </select>
                    <div style={{ fontSize:11,color:"#aaa",marginTop:3 }}>Resale levy applies when buying a new subsidised flat</div>
                  </div>
                )}
              </div>
              <div>{inputField("Estimated renovation cost for new flat (S$)",renovCost,setRenovCost,"e.g. 30000",
                "Basic: ~$20–40k · Moderate: ~$40–70k · Full renovation: $70k+")}</div>
            </div>

            {canCalc&&(
              <div style={{ border:"1.5px solid #d8d8d8",borderRadius:12,padding:"12px 16px",background:"#fafafa",marginBottom:14 }}>
                <div style={{ fontSize:13.5,fontWeight:700,color:"#333",marginBottom:8 }}>Estimated Proceeds Breakdown</div>
                {subhead("From sale of current flat")}
                {rowTip("Gross sale proceeds",null,fmt(sale),"#1a6e3c")}
                {rowTip(`Less: CPF refund`,`When you sell, you must refund the CPF principal (${fmt(cpf)}) you used plus accrued interest at 2.5% p.a. over ${years} years (= ${fmt(cpfInterest)}). Total refund: ${fmt(cpfRefund)}. This goes back to your CPF OA.`,`−${fmt(cpfRefund)}`,RED)}
                {rowTip("Less: Agent commission (1%)","Standard HDB resale agent commission is typically 1% of the sale price. Negotiate with your agent.",`−${fmt(sellingAgent)}`,RED)}
                {rowTip("Less: Legal & admin fees","Estimated legal conveyancing fees for the sale (~$2,500–$3,500). Confirm with your solicitor.",`−${fmt(sellingLegal)}`,RED)}
                {rowTip("= Cash in hand after sale","This is the cash you receive. The CPF refund goes to your OA, not here.",fmt(cashFromSale),cashFromSale>=0?"#1a6e3c":RED)}

                {subhead("Purchase of new flat")}
                {rowTip("New flat price",null,`−${fmt(newFlat)}`,RED)}
                {rowTip("CPF OA used for purchase","Your CPF OA refund (up to the new flat price) can be used to pay for the new flat, reducing the cash you need.",`+${fmt(cpfForNew)}`,"#1a6e3c")}
                {rowTip("Less: Buyer's Stamp Duty",`BSD is a tiered tax on the purchase price: 1% on first $180k, 2% on next $180k, 3% on next $640k, 4% above. Your BSD: ${fmt(bsd)}.`,`−${fmt(bsd)}`,RED)}
                {!isBTO&&buyingAgent>0&&rowTip("Less: Agent commission (1%)","Buyer's agent commission for resale flat, typically 1%.",`−${fmt(buyingAgent)}`,RED)}
                {rowTip("Less: Legal & admin fees","Estimated legal conveyancing fees for the purchase (~$2,500–$3,500).",`−${fmt(buyingLegal)}`,RED)}
                {levy>0&&rowTip("Less: Resale levy",`A resale levy applies when you buy a new subsidised (BTO) flat after previously owning a subsidised flat. Amount varies by flat type sold: 3-room $30k, 4-room $40k, 5-room $45k, Exec $50k.`,`−${fmt(levy)}`,RED)}
                {renov>0&&rowTip("Less: Renovation cost","Your estimated renovation budget for the new flat.",`−${fmt(renov)}`,RED)}
                {rowTip("= Net cash out for new flat","Total cash you need to pay for the new flat, after using CPF.",`−${fmt(cashForNew+renov)}`,RED)}

                <div style={{ display:"flex",justifyContent:"space-between",padding:"8px 0",borderTop:"2px solid #ccc",marginTop:3,fontSize:14,fontWeight:800 }}>
                  <span>Net cash proceeds</span>
                  <span style={{ color:netCash>=0?"#1a6e3c":RED }}>{fmt(netCash)}</span>
                </div>

                {subhead("Bonuses & grants")}
                {rowTip(`SHB bonus`,`Silver Housing Bonus: up to $30,000 when buying a 3-room flat, or up to $40,000 for 2-room Flexi / CCA or smaller. You commit up to $60,000 net CPF RA increase (from the CPF refund — no extra cash needed).`,`+${fmt(shbBonus)}`,"#1a6e3c")}
                {phgGrant>0&&rowTip("Proximity Housing Grant","PHG of up to $30,000 for buying a resale flat within 4km of your children. Not available for BTO.","+ "+fmt(phgGrant),"#1a6e3c")}

                <div style={{ display:"flex",justifyContent:"space-between",padding:"9px 0 3px",borderTop:"2px solid #ccc",marginTop:3,fontSize:15,fontWeight:800 }}>
                  <span>Estimated total cash + SHB</span>
                  <span style={{ color:totalWithBonuses>=0?"#1a6e3c":RED }}>{fmt(totalWithBonuses)}</span>
                </div>

                {cpfLeftover>0&&(
                  <div style={{ fontSize:12,color:"#555",marginTop:6 }}>
                    CPF OA leftover after purchase: <strong>{fmt(cpfLeftover)}</strong> — stays in CPF to boost CPF LIFE payouts
                  </div>
                )}
                <div style={{ marginTop:12,padding:"10px 12px",background:"#fff8e6",borderRadius:8,border:"1px solid #f0d080",fontSize:12.5,color:"#7a5500",lineHeight:1.6 }}>
                  <strong>CPF note (55+):</strong> The CPF refund ({fmt(cpfRefund)}) goes back to your CPF OA, not as cash. Funds above the Basic Retirement Sum (~$106,500) may be swept to CPF RA. For SHB, you commit up to {fmt(Math.min(60000,cpfRefund))} net CPF RA increase — from the refund, not extra cash.
                </div>
                {isBTO&&levy>0&&(
                  <div style={{ marginTop:8,padding:"10px 12px",background:"#e8eeff",borderRadius:8,border:"1px solid #a8baf0",fontSize:12.5,color:"#1a2e8c",lineHeight:1.6 }}>
                    <strong>BTO note:</strong> Resale levy of {fmt(levy)} applies. BTO prices are typically 15–30% below resale. Apply under the <strong>Silver Housing Priority Scheme</strong> for a higher ballot chance. Check eligibility at <a href="https://www.hdb.gov.sg/cs/infoweb/residential/buying-a-flat/buying-procedure-for-new-flats/eligibility" target="_blank" rel="noreferrer" style={{ color:"#1a2e8c" }}>HDB BTO Eligibility ↗</a>
                  </div>
                )}
              </div>
            )}
            {!canCalc&&<div style={{ padding:"11px 14px",background:"#f0f0f0",borderRadius:8,marginBottom:14,fontSize:13,color:"#777" }}>Enter your sale price and target purchase price to see the breakdown.</div>}

            <button onClick={()=>onContinue({ netCash, totalWithBonuses, shbBonus, phgGrant, cpfLeftover, calcDone: canCalc })}
              style={{ width:"100%",background:TEAL,color:"#fff",border:"none",borderRadius:10,padding:"14px 0",fontSize:15,fontWeight:700,cursor:"pointer" }}>
              Continue to check SHB eligibility →
            </button>
            <div style={{ fontSize:12,color:"#aaa",marginTop:8,textAlign:"center" }}>Figures are optional — you can continue without filling them in</div>
          </div>
        );
      }

      // ── Main App ──────────────────────────────────────────────────────────
      function App(){
        const[history,      setHistory]     =useState([]);
        const[current,      setCurrent]     =useState("q_spend");
        const[userInputs,   setUserInputs]  =useState({});
        const[inputVal,     setInputVal]    =useState("");
        const[multiSelected,setMultiSelected]=useState(new Set());

        function navigate(next, inputs={}){
          setHistory(h=>[...h,current]);
          if(Object.keys(inputs).length) setUserInputs(p=>({...p,...inputs}));
          setInputVal("");
          setMultiSelected(new Set());
          setCurrent(next);
        }
        function goBack(){
          if(!history.length)return;
          setCurrent(history[history.length-1]);
          setHistory(h=>h.slice(0,-1));
        }
        function restart(){ setHistory([]); setCurrent("q_spend"); setUserInputs({}); setInputVal(""); }

        const isResult  =current.startsWith("result_");
        const isTerminal=current in terminals;
        const node      =nodes[current];
        const scheme    =isResult?current.replace("result_",""):null;
        const terminal  =isTerminal?terminals[current]:null;
        const tc=terminal?(termColors[terminal.type]||TEAL):TEAL;
        const tb=terminal?(termBgs[terminal.type]||TEAL_LIGHT):TEAL_LIGHT;

        const btnY={ flex:1,background:TEAL,color:"#fff",border:"none",borderRadius:10,padding:"14px 0",fontSize:15,fontWeight:700,cursor:"pointer" };
        const btnN={ flex:1,background:"#fff",color:"#555",border:"1.5px solid #ccc",borderRadius:10,padding:"14px 0",fontSize:15,fontWeight:700,cursor:"pointer" };
        const card={ border:`1.5px solid ${TEAL_MID}`,borderRadius:12,padding:24,marginBottom:16,background:TEAL_LIGHT };

        return(
          <div style={{ fontFamily:"'Segoe UI',Arial,sans-serif",maxWidth:680,margin:"0 auto",padding:"24px 16px",background:"#fff",minHeight:"100vh" }}>

            {/* Header */}
            <div style={{ background:TEAL,borderRadius:12,padding:"20px 24px",marginBottom:20,color:"#fff" }}>
              <div style={{ fontSize:11,letterSpacing:1,opacity:0.75,marginBottom:4,textTransform:"uppercase" }}>HDB Retirement Planning</div>
              <div style={{ fontSize:21,fontWeight:700,lineHeight:1.3 }}>Housing Monetisation Guide</div>
              <div style={{ fontSize:13,opacity:0.85,marginTop:5 }}>Answer a few questions to find the right scheme for your situation</div>
            </div>

            {/* Nav */}
            <div style={{ display:"flex",alignItems:"center",gap:8,marginBottom:18 }}>
              {history.length>0&&<button onClick={goBack} style={{ background:TEAL_LIGHT,border:`1px solid ${TEAL_MID}`,borderRadius:8,padding:"6px 14px",fontSize:13,color:TEAL,cursor:"pointer",fontWeight:600 }}>← Back</button>}
              <button onClick={restart} style={{ background:"#f5f5f5",border:"1px solid #ddd",borderRadius:8,padding:"6px 14px",fontSize:13,color:"#666",cursor:"pointer" }}>↺ Restart</button>
              <div style={{ flex:1 }}/><span style={{ fontSize:12,color:"#aaa" }}>Step {history.length+1}</span>
            </div>

            {/* Yes/No */}
            {node&&node.type==="yesno"&&(
              <div style={card}>
                <div style={{ fontSize:17,fontWeight:700,color:"#1a1a1a",marginBottom:8 }}>{node.text}</div>
                {node.sub&&<div style={{ fontSize:13,color:"#555",marginBottom:20,lineHeight:1.6 }}>{node.sub}</div>}
                <div style={{ display:"flex",gap:12 }}>
                  <button onClick={()=>navigate(node.yes)} style={btnY}>✓ Yes</button>
                  <button onClick={()=>navigate(node.no)}  style={btnN}>✗ No</button>
                </div>
              </div>
            )}

            {/* Input */}
            {node&&node.type==="input"&&(
              <div style={card}>
                <div style={{ fontSize:17,fontWeight:700,color:"#1a1a1a",marginBottom:8 }}>{node.text}</div>
                {node.sub&&<div style={{ fontSize:13,color:"#555",marginBottom:14,lineHeight:1.6 }}>{node.sub}</div>}
                <input type={node.inputType||"text"} value={inputVal} onChange={e=>setInputVal(e.target.value)}
                  placeholder={node.placeholder} autoFocus
                  onKeyDown={e=>e.key==="Enter"&&inputVal&&navigate(node.next,{[node.key]:inputVal})}
                  style={{ marginBottom:14 }} />
                <div style={{ display:"flex",flexDirection:"column",gap:8 }}>
                  <button onClick={()=>inputVal&&navigate(node.next,{[node.key]:inputVal})} disabled={!inputVal}
                    style={{ ...btnY,opacity:inputVal?1:0.45 }}>Continue →</button>
                  <button onClick={()=>navigate(node.next)} style={{ ...btnN,padding:"10px 0",fontSize:13 }}>Skip this question</button>
                </div>
              </div>
            )}

            {/* Choice */}
            {node&&node.type==="choice"&&(
              <div style={card}>
                <div style={{ fontSize:17,fontWeight:700,color:"#1a1a1a",marginBottom:8 }}>{node.text}</div>
                {node.sub&&<div style={{ fontSize:13,color:"#555",marginBottom:14,lineHeight:1.6 }}>{node.sub}</div>}
                <div style={{ display:"flex",flexDirection:"column",gap:10 }}>
                  {node.options.map((opt,i)=>(
                    <button key={i} onClick={()=>navigate(opt.next,opt.inputs||{})}
                      style={{ background:"#fff",border:`1.5px solid ${TEAL_MID}`,borderRadius:10,padding:"13px 16px",cursor:"pointer",textAlign:"left" }}>
                      <div style={{ fontSize:15,fontWeight:700,color:"#1a1a1a" }}>{opt.label}</div>
                      {opt.sub&&<div style={{ fontSize:12.5,color:"#666",marginTop:3 }}>{opt.sub}</div>}
                    </button>
                  ))}
                </div>
              </div>
            )}

            {/* Multi-choice (flat size selector) */}
            {node&&node.type==="multiChoice"&&(()=>{
              const toggle=id=>setMultiSelected(prev=>{
                const s=new Set(prev);
                s.has(id)?s.delete(id):s.add(id);
                return s;
              });
              const canGo=multiSelected.size>0;
              const onGo=()=>{
                const selected=[...multiSelected];
                const hasBTOOnly=selected.includes("2room")||selected.includes("cca");
                const has3room=selected.includes("3room");
                // Determine smallest flat for SHB bonus purposes
                const flatSize=hasBTOOnly?"small":"3room";
                const inputs={ flatSizes:selected, flatSize,
                  ...(hasBTOOnly&&!has3room?{flatType:"bto"}:{}) };
                navigate(has3room?"q_bto_resale":"q_region", inputs);
              };
              return(
                <div style={card}>
                  <div style={{ fontSize:17,fontWeight:700,color:"#1a1a1a",marginBottom:8 }}>{node.text}</div>
                  {node.sub&&<div style={{ fontSize:13,color:"#555",marginBottom:14,lineHeight:1.6 }}>{node.sub}</div>}
                  <div style={{ display:"flex",flexDirection:"column",gap:10,marginBottom:16 }}>
                    {node.options.map((opt)=>{
                      const sel=multiSelected.has(opt.id);
                      return(
                        <button key={opt.id} onClick={()=>toggle(opt.id)}
                          style={{ background:sel?"#e8f0fb":"#fff",border:`2px solid ${sel?"#1a4e8c":TEAL_MID}`,
                            borderRadius:10,padding:"13px 16px",cursor:"pointer",textAlign:"left",
                            display:"flex",justifyContent:"space-between",alignItems:"flex-start",transition:"all 0.15s" }}>
                          <div style={{ flex:1 }}>
                            <div style={{ fontSize:15,fontWeight:700,color:sel?"#1a4e8c":"#1a1a1a",marginBottom:3 }}>{opt.label}</div>
                            {opt.sub&&<div style={{ fontSize:12,color:"#666",lineHeight:1.5 }}>{opt.sub}</div>}
                            {opt.badge&&<span style={{ display:"inline-block",marginTop:5,fontSize:10.5,background:sel?"#1a4e8c":"#888",color:"#fff",borderRadius:12,padding:"2px 8px" }}>{opt.badge}</span>}
                          </div>
                          <span style={{ fontSize:20,marginLeft:10,marginTop:2,flexShrink:0 }}>{sel?"✅":"⬜"}</span>
                        </button>
                      );
                    })}
                  </div>
                  <button onClick={onGo} disabled={!canGo}
                    style={{ ...btnY,opacity:canGo?1:0.4,width:"100%" }}>
                    Continue →
                  </button>
                </div>
              );
            })()}

            {/* Retirement calculator */}
            {node&&node.type==="retirementCalc"&&(
              <div style={card}>
                <RetirementCalculator
                  monthlySpend={userInputs.monthlySpend}
                  dependentsAmt={userInputs.dependentsAmt}
                  onContinue={(surplus,gap)=>{
                    setHistory(h=>[...h,current]);
                    setUserInputs(p=>({...p,hasSurplus:surplus,monthlyGap:gap}));
                    setInputVal("");
                    setCurrent(surplus?node.nextSurplus:node.nextGap);
                  }}
                />
              </div>
            )}

            {/* Rightsizing calculator */}
            {node&&node.type==="calculator"&&(
              <div style={card}>
                <Calculator userInputs={userInputs} onContinue={(results)=>navigate(node.next,results)} />
              </div>
            )}

            {/* Result */}
            {isResult&&scheme&&(
              <div>
                <div style={{ background:"#e8f8ef",border:"2px solid #1a6e3c",borderRadius:12,padding:16,marginBottom:14,textAlign:"center" }}>
                  <PiggyBankAnim />
                  <div style={{ fontSize:13,fontWeight:600,color:"#1a6e3c",marginBottom:4 }}>✅ Recommended Option</div>
                  <div style={{ fontSize:18,fontWeight:800,color:"#1a1a1a" }}>{schemes[scheme].name}</div>
                </div>
                <SchemeCard id={scheme} compact={false} />
                {scheme==="LBS"&&<LBSCalculator />}
                {scheme==="SHB"&&userInputs.calcDone&&(
                  <div style={{ border:"2px solid #1a6e3c",borderRadius:12,padding:16,marginBottom:12,background:"#e8f5ee" }}>
                    <div style={{ fontSize:13,fontWeight:700,color:"#1a6e3c",marginBottom:10 }}>💰 Your Estimated SHB Proceeds</div>
                    <div style={{ display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid #c8e8d8",fontSize:13 }}>
                      <span style={{ color:"#555" }}>Net cash from right-sizing</span>
                      <span style={{ fontWeight:700,color:userInputs.netCash>=0?"#1a6e3c":RED }}>{fmt(userInputs.netCash||0)}</span>
                    </div>
                    <div style={{ display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid #c8e8d8",fontSize:13 }}>
                      <span style={{ color:"#555" }}>SHB cash bonus</span>
                      <span style={{ fontWeight:700,color:"#1a6e3c" }}>+{fmt(userInputs.shbBonus||0)}</span>
                    </div>
                    {(userInputs.phgGrant||0)>0&&(
                      <div style={{ display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid #c8e8d8",fontSize:13 }}>
                        <span style={{ color:"#555" }}>Proximity Housing Grant</span>
                        <span style={{ fontWeight:700,color:"#1a6e3c" }}>+{fmt(userInputs.phgGrant)}</span>
                      </div>
                    )}
                    <div style={{ display:"flex",justifyContent:"space-between",padding:"9px 0 3px",borderTop:"2px solid #1a6e3c",marginTop:3,fontSize:15,fontWeight:800 }}>
                      <span>Total estimated cash</span>
                      <span style={{ color:"#1a6e3c" }}>{fmt(userInputs.totalWithBonuses||0)}</span>
                    </div>
                    {(userInputs.cpfLeftover||0)>0&&(
                      <div style={{ fontSize:12,color:"#555",marginTop:6 }}>
                        + CPF OA leftover: <strong>{fmt(userInputs.cpfLeftover)}</strong> boosting your CPF LIFE payouts
                      </div>
                    )}
                  </div>
                )}
                <GapAnalysis scheme={scheme} userInputs={userInputs} />
                <CPFRetirementStatus cpfRA={userInputs.cpfRA} />
                <GovtSchemesCard userInputs={userInputs} />
                <ExploreOtherOptions scheme={scheme} userInputs={userInputs} />
                <div style={{ fontSize:12.5,color:"#888",marginTop:12,lineHeight:1.6 }}>
                  ⚠️ General guide only. Use HDB's{" "}
                  <a href="https://services2.hdb.gov.sg/webapp/BF21HMO/BF21PHMOStart.jsp" target="_blank" rel="noreferrer" style={{ color:TEAL }}>
                    Enquire Housing Monetisation Options e-Service
                  </a>{" "}
                  for a personalised assessment.
                </div>
              </div>
            )}

            {/* Terminal */}
            {isTerminal&&terminal&&(
              <div style={{ border:`2px solid ${tc}`,borderRadius:12,padding:18,marginBottom:14,background:tb }}>
                <div style={{ fontSize:16,fontWeight:700,color:tc,marginBottom:8 }}>
                  {terminal.type==="error"?"❌":terminal.type==="warning"?"⚠️":terminal.type==="success"?"✅":terminal.type==="planning"?"🗓️":"ℹ️"}{" "}{terminal.title}
                </div>
                <div style={{ fontSize:14,color:"#333",lineHeight:1.65,marginBottom:terminal.timeline?12:0 }}>{terminal.msg}</div>

                {/* Planning timeline */}
                {terminal.timeline&&(
                  <div style={{ marginBottom:12 }}>
                    {terminal.timeline.map((t,i)=>(
                      <div key={i} style={{ display:"flex",gap:12,marginBottom:8,alignItems:"flex-start" }}>
                        <div style={{ minWidth:40,background:tc,color:"#fff",borderRadius:20,padding:"3px 8px",fontSize:12,fontWeight:700,textAlign:"center",marginTop:2 }}>{t.age}</div>
                        <div>
                          <div style={{ fontSize:13,fontWeight:700,color:tc }}>{t.label}</div>
                          <div style={{ fontSize:12,color:"#555",marginTop:2 }}>{t.detail}</div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
                {terminal.tipNow&&(
                  <div style={{ background:"#fff",borderRadius:8,padding:"10px 12px",fontSize:12.5,color:"#333",lineHeight:1.6,marginBottom:12,border:"1px solid #e0e0e0" }}>
                    <strong>In the meantime:</strong> {terminal.tipNow}
                  </div>
                )}
                {terminal.options&&(
                  <div style={{ marginTop:8 }}>
                    <div style={{ fontSize:13,fontWeight:600,color:"#555",marginBottom:8 }}>Alternatives to explore:</div>
                    {terminal.options.map(id=><SchemeCard key={id} id={id} compact={false} />)}
                  </div>
                )}
                {terminal.link&&<a href={terminal.link.url} target="_blank" rel="noreferrer" style={{ display:"inline-block",marginTop:8,fontSize:13,color:tc }}>{terminal.link.text} ↗</a>}
                {terminal.links&&(
                  <div style={{ marginTop:10, display:"flex", flexDirection:"column", gap:6 }}>
                    {terminal.links.map((l,i)=>(
                      <a key={i} href={l.url} target="_blank" rel="noreferrer" style={{ fontSize:13, color:tc, display:"inline-block" }}>{l.text} ↗</a>
                    ))}
                  </div>
                )}
                <div style={{ fontSize:12,color:"#888",marginTop:10 }}>
                  Speak with HDB at any branch or via <a href="https://www.hdb.gov.sg" target="_blank" rel="noreferrer" style={{ color:TEAL }}>hdb.gov.sg</a>
                </div>
              </div>
            )}

            {/* Scheme overview (during questions) */}
            {!isResult&&!isTerminal&&node&&!["calculator","retirementCalc"].includes(node.type)&&(
              <div style={{ marginTop:24 }}>
                <div style={{ fontSize:11,fontWeight:700,color:"#bbb",letterSpacing:0.5,textTransform:"uppercase",marginBottom:10 }}>The 4 Options at a Glance</div>
                <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:8 }}>
                  {Object.entries(schemes).map(([id,s])=>(
                    <div key={id} style={{ background:s.bg,border:`1.5px solid ${s.border}`,borderRadius:10,padding:"9px 12px" }}>
                      <div style={{ fontWeight:700,fontSize:12,color:s.color }}>{s.name}</div>
                      <div style={{ fontSize:11,color:"#555",marginTop:3 }}>{s.summary}</div>
                    </div>
                  ))}
                </div>
                <div style={{ fontSize:11,color:"#ccc",marginTop:10,textAlign:"center" }}>Updated Dec 2025 · Source: HDB</div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
